name: Run hexcode pull and prod LCF

on:
  workflow_dispatch:
  schedule:
    # Runs every Monday at 00:00 UTC
    - cron: "0 0 * * 1"
  
jobs:
  weekly-task:
    runs-on: ubuntu-latest
    steps:
      # checkout repo
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.9" # pin a specific version is best practice
          enable-cache: true
      
      - name: run pull_hexcodes
        run: uv run decision_tree.py
        working-directory: ./pull_hexcodes

      - name: run clinical LCF workflow
        run: uv run main.py -o lineage_class.csv
      
      - name: run wastewater LCF workflow
        run: uv run main.py --workflow_type wastewater -o lineage_class_wastewater.csv
      
      # Commit just the parsed hexcodes csv file
      - uses: EndBug/add-and-commit@v9
        with: 
          add: 'pull_hexcodes/final_augmented_runninglist.csv lineage_class.csv lineage_class_wastewater.csv lineage_class_wastewater.csv'
